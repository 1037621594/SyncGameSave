plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.syncgamesave'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.syncgamesave"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Public development identity for personal builds; never use as a production signing key.
    signingConfigs {
        development {
            storeFile rootProject.file('signing/development.keystore')
            storePassword 'android'
            keyAlias 'syncgamesave-development'
            keyPassword 'android'
            storeType 'JKS'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.development
        }
        release {
            signingConfig signingConfigs.development
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
}
